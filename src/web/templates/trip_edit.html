{% extends "base.html" %}
{% block title %}Редактирование рейса #{{ trip.id }} — Freight TMS{% endblock %}
{% block content %}

<a href="/panel/trips/{{ trip.id }}" class="back-link" data-i18n="back_to_trip">← Вернуться к рейсу</a>

<div class="page-hdr" style="margin-bottom:20px;">
    <h1 data-i18n="edit_trip">Редактор рейса</h1> <h1>#{{ trip.id }}</h1>
</div>

<div class="card" style="max-width:680px;">
    <div class="card-hdr"><span class="card-title" data-i18n="trip_data">Данные рейса</span></div>
    <div class="card-body">
        <form action="/panel/trips/{{ trip.id }}/edit" method="post">

            <div class="form-grid-2">
                <div class="form-row">
                    <label for="driver_id" data-i18n="driver_required">Водитель *</label>
                    <select name="driver_id" id="driver_id" required>
                        <option value="" data-i18n="select_driver">— выберите водителя —</option>
                        {% for d in drivers %}
                        <option value="{{ d.id }}" {% if trip.driver_id == d.id %}selected{% endif %}>{{ d.name or d.tg_id }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-row">
                    <label for="vehicle_id" data-i18n="vehicle_required">Транспорт *</label>
                    <select name="vehicle_id" id="vehicle_id" required>
                        <option value="" data-i18n="select_vehicle">— выберите борт —</option>
                        {% for v in vehicles %}
                        <option value="{{ v.id }}" {% if trip.vehicle_id == v.id %}selected{% endif %}>{{ v.license_plate }}{% if v.make %} — {{ v.make }} {{ v.model or '' }}{% endif %}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-row">
                    <label for="status" data-i18n="trip_status_required">Статус рейса *</label>
                    <select name="status" id="status" required>
                        {% for st in TripStatus %}
                        <option value="{{ st.value }}" {% if trip.status == st.value %}selected{% endif %}>
                            {% if st.value == 'PLANNED' %}<span data-i18n="status_planned">Запланирован</span>
                            {% elif st.value == 'ACTIVE' %}<span data-i18n="status_active_trip">Активен</span>
                            {% elif st.value == 'COMPLETED' %}<span data-i18n="status_completed">Завершён</span>
                            {% elif st.value == 'CANCELLED' %}<span data-i18n="status_cancelled">Отменён</span>
                            {% else %}{{ st.value }}{% endif %}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-row">
                    <label for="delivery_status" data-i18n="delivery_status">Статус доставки</label>
                    <input type="text" name="delivery_status" id="delivery_status" value="{{ trip.delivery_status or '' }}" placeholder="Например: Доставлено">
                </div>
            </div>

            <div class="form-row">
                <label for="route_details" data-i18n="route">Маршрут</label>
                <input type="text" name="route_details" id="route_details" value="{{ trip.route_details or '' }}" placeholder="Например: Алматы — Астана" maxlength="500">
            </div>

            <div class="form-row">
                <label for="load_info" data-i18n="load_info">Груз</label>
                <input type="text" name="load_info" id="load_info" value="{{ trip.load_info or '' }}" placeholder="Тип и объём груза" maxlength="500">
            </div>

            <div class="form-row">
                <label for="client_name" data-i18n="client_name">Клиент</label>
                <input type="text" name="client_name" id="client_name" value="{{ trip.client_name or '' }}" placeholder="Наименование клиента" maxlength="255">
            </div>

            <div class="form-grid-2">
                <div class="form-row">
                    <label for="price" data-i18n="freight_price">Стоимость (Фрахт)</label>
                    <input type="number" step="0.01" name="price" id="price" value="{{ trip.price or '' }}" placeholder="Сумма оплаты от клиента">
                </div>
                <div class="form-row">
                    <label for="price_currency" data-i18n="freight_currency">Валюта фрахта</label>
                    <select name="price_currency" id="price_currency">
                        <option value="KZT" {% if trip.price_currency == 'KZT' %}selected{% endif %}>KZT</option>
                        <option value="USD" {% if trip.price_currency == 'USD' %}selected{% endif %}>USD</option>
                        <option value="RUB" {% if trip.price_currency == 'RUB' %}selected{% endif %}>RUB</option>
                    </select>
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-row">
                    <label for="planned_departure" data-i18n="planned_departure_label">Планируемое отправление</label>
                    <input type="datetime-local" name="planned_departure" id="planned_departure" value="{{ trip.planned_departure.strftime('%Y-%m-%dT%H:%M') if trip.planned_departure else '' }}">
                </div>
                <div class="form-row">
                    <label for="planned_arrival" data-i18n="planned_arrival_label">Планируемое прибытие</label>
                    <input type="datetime-local" name="planned_arrival" id="planned_arrival" value="{{ trip.planned_arrival.strftime('%Y-%m-%dT%H:%M') if trip.planned_arrival else '' }}">
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-row">
                    <label for="start_odometer" data-i18n="start_odometer">Одометр (начало)</label>
                    <input type="number" name="start_odometer" id="start_odometer" value="{{ trip.start_odometer if trip.start_odometer is not none else '' }}">
                </div>
                <div class="form-row">
                    <label for="end_odometer" data-i18n="end_odometer">Одометр (конец)</label>
                    <input type="number" name="end_odometer" id="end_odometer" value="{{ trip.end_odometer if trip.end_odometer is not none else '' }}">
                </div>
            </div>

            <div class="action-group" style="margin-top:8px;">
                <button type="submit" class="btn" data-i18n="save_btn">Сохранить</button>
                <a href="/panel/trips/{{ trip.id }}" class="btn btn-ghost" data-i18n="cancel">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
