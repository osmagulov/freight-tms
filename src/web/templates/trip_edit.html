{% extends "base.html" %}
{% block title %}Редактирование рейса #{{ trip.id }} — Freight TMS{% endblock %}
{% block content %}

<a href="/panel/trips/{{ trip.id }}" class="back-link">← Вернуться к рейсу</a>

<div class="page-hdr" style="margin-bottom:20px;">
    <h1>Редактор рейса #{{ trip.id }}</h1>
</div>

<div class="card" style="max-width:680px;">
    <div class="card-hdr"><span class="card-title">Данные рейса</span></div>
    <div class="card-body">
        <form action="/panel/trips/{{ trip.id }}/edit" method="post">

            <div class="form-grid-2">
                <div class="form-row">
                    <label for="driver_id">Водитель *</label>
                    <select name="driver_id" id="driver_id" required>
                        <option value="">— выберите водителя —</option>
                        {% for d in drivers %}
                        <option value="{{ d.id }}" {% if trip.driver_id == d.id %}selected{% endif %}>{{ d.name or d.tg_id }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-row">
                    <label for="vehicle_id">Транспорт *</label>
                    <select name="vehicle_id" id="vehicle_id" required>
                        <option value="">— выберите борт —</option>
                        {% for v in vehicles %}
                        <option value="{{ v.id }}" {% if trip.vehicle_id == v.id %}selected{% endif %}>{{ v.license_plate }}{% if v.make %} — {{ v.make }} {{ v.model or '' }}{% endif %}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-row">
                    <label for="status">Статус рейса *</label>
                    <select name="status" id="status" required>
                        {% for st in TripStatus %}
                        <option value="{{ st.value }}" {% if trip.status == st.value %}selected{% endif %}>
                            {% if st.value == 'PLANNED' %}Запланирован
                            {% elif st.value == 'ACTIVE' %}Активен
                            {% elif st.value == 'COMPLETED' %}Завершён
                            {% elif st.value == 'CANCELLED' %}Отменён
                            {% else %}{{ st.value }}{% endif %}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-row">
                    <label for="delivery_status">Статус доставки</label>
                    <input type="text" name="delivery_status" id="delivery_status" value="{{ trip.delivery_status or '' }}" placeholder="Например: Доставлено">
                </div>
            </div>

            <div class="form-row">
                <label for="route_details">Маршрут</label>
                <input type="text" name="route_details" id="route_details" value="{{ trip.route_details or '' }}" placeholder="Например: Алматы — Астана" maxlength="500">
            </div>

            <div class="form-row">
                <label for="load_info">Груз</label>
                <input type="text" name="load_info" id="load_info" value="{{ trip.load_info or '' }}" placeholder="Тип и объём груза" maxlength="500">
            </div>

            <div class="form-row">
                <label for="client_name">Клиент</label>
                <input type="text" name="client_name" id="client_name" value="{{ trip.client_name or '' }}" placeholder="Наименование клиента" maxlength="255">
            </div>

            <div class="form-grid-2">
                <div class="form-row">
                    <label for="planned_departure">Планируемое отправление</label>
                    <input type="datetime-local" name="planned_departure" id="planned_departure" value="{{ trip.planned_departure.strftime('%Y-%m-%dT%H:%M') if trip.planned_departure else '' }}">
                </div>
                <div class="form-row">
                    <label for="planned_arrival">Планируемое прибытие</label>
                    <input type="datetime-local" name="planned_arrival" id="planned_arrival" value="{{ trip.planned_arrival.strftime('%Y-%m-%dT%H:%M') if trip.planned_arrival else '' }}">
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-row">
                    <label for="start_odometer">Одометр (начало)</label>
                    <input type="number" name="start_odometer" id="start_odometer" value="{{ trip.start_odometer if trip.start_odometer is not none else '' }}">
                </div>
                <div class="form-row">
                    <label for="end_odometer">Одометр (конец)</label>
                    <input type="number" name="end_odometer" id="end_odometer" value="{{ trip.end_odometer if trip.end_odometer is not none else '' }}">
                </div>
            </div>

            <div class="action-group" style="margin-top:8px;">
                <button type="submit" class="btn">Сохранить</button>
                <a href="/panel/trips/{{ trip.id }}" class="btn btn-ghost">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
