{% extends "base.html" %}
{% block title %}Добавить борт — Freight TMS{% endblock %}
{% block content %}

<a href="/panel/fleet" class="back-link">← Транспорт</a>

<div class="page-hdr" style="margin-bottom:20px;">
    <h1>Новый борт</h1>
</div>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

<div class="card" style="max-width:520px;">
    <div class="card-hdr"><span class="card-title">Данные транспортного средства</span></div>
    <div class="card-body">
        <form method="post" action="/panel/vehicles/add">
            <div class="form-row">
                <label>Гос. номер *</label>
                <input type="text" name="license_plate" placeholder="018 АВ 01" required autofocus>
            </div>
            <div class="form-grid-2">
                <div class="form-row">
                    <label>Марка</label>
                    <input type="text" name="make" placeholder="КАМАЗ">
                </div>
                <div class="form-row">
                    <label>Модель</label>
                    <input type="text" name="model" placeholder="65117">
                </div>
            </div>
            <div class="form-grid-2">
                <div class="form-row">
                    <label>Год выпуска</label>
                    <input type="number" name="year" placeholder="2018" min="1990" max="2030">
                </div>
                <div class="form-row">
                    <label>Норма расхода (л/100км)</label>
                    <input type="number" name="fuel_norm_per_100km" step="0.1" min="0" placeholder="28.5">
                </div>
            </div>
            <div class="action-group" style="margin-top:8px;">
                <button type="submit" class="btn">Добавить</button>
                <a href="/panel/fleet" class="btn btn-ghost">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
