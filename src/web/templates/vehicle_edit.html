{% extends "base.html" %}
{% block title %}Редактировать борт — Freight TMS{% endblock %}
{% block content %}

<a href="/panel/drivers" class="back-link">← Водители</a>

<div class="page-hdr" style="margin-bottom:20px;">
    <h1>Борт: {{ vehicle.license_plate }}</h1>
</div>

<div class="card" style="max-width:480px;">
    <div class="card-hdr"><span class="card-title">Технические данные</span></div>
    <div class="card-body">
        <form method="post" action="/panel/vehicles/{{ vehicle.id }}/edit">
            <div class="form-row">
                <label>Марка</label>
                <input type="text" name="make" value="{{ vehicle.make or '' }}" placeholder="KAMAZ">
            </div>
            <div class="form-row">
                <label>Модель</label>
                <input type="text" name="model" value="{{ vehicle.model or '' }}" placeholder="65117">
            </div>
            <div class="form-row">
                <label>Год выпуска</label>
                <input type="number" name="year" min="1990" max="2030"
                       value="{{ vehicle.year or '' }}" placeholder="2018">
            </div>
            <div class="form-row">
                <label>Норма расхода (л/100км)</label>
                <input type="number" name="fuel_norm_per_100km" step="0.1" min="0"
                       value="{{ vehicle.fuel_norm_per_100km or '' }}" placeholder="28.5">
            </div>
            <div class="action-group" style="margin-top:8px;">
                <button type="submit" class="btn">Сохранить</button>
                <a href="/panel/drivers" class="btn btn-ghost">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
