<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Freight TMS{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
    <style>
        /* ── Design tokens ── */
        :root {
            --sidebar-bg: #0f172a;
            --sidebar-w: 220px;
            --accent: #2563eb;
            --accent-h: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
            --purple: #7c3aed;
            --bg: #f1f5f9;
            --surface: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
            --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
            --r: 8px;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
            background: var(--bg); color: var(--text); margin: 0; font-size: 14px; line-height: 1.5;
        }

        /* ── Sidebar ── */
        .sidebar {
            position: fixed; left: 0; top: 0; height: 100vh; width: var(--sidebar-w);
            background: var(--sidebar-bg); display: flex; flex-direction: column;
            z-index: 200; overflow-y: auto; overflow-x: hidden;
        }
        .sb-brand {
            padding: 18px 16px 14px; border-bottom: 1px solid rgba(255,255,255,.06); flex-shrink: 0;
        }
        .sb-brand-name { color: #fff; font-size: 14.5px; font-weight: 700; letter-spacing: .2px; }
        .sb-brand-sub  { color: rgba(255,255,255,.3); font-size: 11px; margin-top: 2px; }
        .sb-nav { padding: 8px 0; flex: 1; }
        .sb-section {
            padding: 12px 16px 4px; font-size: 10px; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,.22);
        }
        .sb-link {
            display: flex; align-items: center; gap: 9px;
            padding: 8px 16px; color: rgba(255,255,255,.55); text-decoration: none;
            font-size: 13.5px; border-left: 3px solid transparent;
            transition: color .12s, background .12s;
        }
        .sb-link:hover  { color: rgba(255,255,255,.9); background: rgba(255,255,255,.05); }
        .sb-link.active { color: #fff; background: rgba(37,99,235,.2); border-left-color: var(--accent); }
        .sb-icon { width: 18px; text-align: center; font-size: 14px; flex-shrink: 0; opacity: .85; }
        .sb-footer {
            padding: 10px 16px 14px; border-top: 1px solid rgba(255,255,255,.06); flex-shrink: 0;
        }
        .sb-footer a {
            display: flex; align-items: center; gap: 8px;
            color: rgba(255,255,255,.35); font-size: 13px; text-decoration: none;
            padding: 5px 0; transition: color .12s;
        }
        .sb-footer a:hover { color: rgba(255,255,255,.7); }

        /* ── Main layout ── */
        .main-wrap { margin-left: var(--sidebar-w); min-height: 100vh; }
        .container  { padding: 28px 32px; max-width: 1280px; }

        /* ── Page header ── */
        .page-hdr {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 22px;
        }
        .page-hdr h1, .page-hdr h2 { margin: 0; font-size: 20px; font-weight: 700; color: var(--text); }
        .page-hdr-left { display: flex; align-items: center; gap: 10px; }

        /* ── KPI cards ── */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; margin-bottom: 24px; }
        .kpi {
            background: var(--surface); border-radius: var(--r); padding: 16px 18px;
            box-shadow: var(--shadow); border-top: 3px solid var(--accent);
        }
        .kpi.green  { border-top-color: var(--success); }
        .kpi.amber  { border-top-color: var(--warning); }
        .kpi.red    { border-top-color: var(--danger);  }
        .kpi.purple { border-top-color: var(--purple);  }
        .kpi-label  { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 8px; }
        .kpi-value  { font-size: 24px; font-weight: 800; color: var(--text); line-height: 1; }
        .kpi-sub    { font-size: 11px; color: var(--muted); margin-top: 4px; }

        /* ── Card ── */
        .card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 20px; }
        .card-hdr {
            padding: 13px 18px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            background: #f8fafc;
        }
        .card-title { font-size: 13.5px; font-weight: 600; color: var(--text); }
        .card-body  { padding: 18px; }

        /* ── Tables ── */
        .table-wrap { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        thead th {
            background: #f8fafc; font-size: 11px; font-weight: 700;
            letter-spacing: .5px; text-transform: uppercase; color: var(--muted);
            padding: 11px 16px; text-align: left; border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        tbody td { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: #f8fafc; }
        tfoot td {
            padding: 12px 16px; font-weight: 700;
            background: #f1f5f9; border-top: 2px solid var(--border);
        }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 8px 16px; border-radius: 6px; font-size: 13.5px; font-weight: 500;
            text-decoration: none; border: none; cursor: pointer; white-space: nowrap;
            transition: background .12s; background: var(--accent); color: #fff;
        }
        .btn:hover   { background: var(--accent-h); color: #fff; }
        .btn-sm      { padding: 5px 11px; font-size: 12.5px; }
        .btn-xs      { padding: 3px 9px; font-size: 12px; }
        .btn-success { background: var(--success); } .btn-success:hover { background: #15803d; }
        .btn-danger  { background: var(--danger);  } .btn-danger:hover  { background: #b91c1c; }
        .btn-amber   { background: var(--warning);  color: #fff; } .btn-amber:hover { background: #b45309; }
        .btn-purple  { background: var(--purple);   } .btn-purple:hover  { background: #6d28d9; }
        .btn-muted   { background: #94a3b8; }        .btn-muted:hover   { background: #64748b; }
        .btn-dark    { background: #1e293b; }        .btn-dark:hover    { background: #0f172a; }
        .btn-ghost   { background: transparent; color: var(--muted); border: 1px solid var(--border); }
        .btn-ghost:hover { background: #f8fafc; color: var(--text); }

        /* ── Badges ── */
        .badge { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
        .badge-planned   { background: #dbeafe; color: #1d4ed8; }
        .badge-active    { background: #dcfce7; color: #15803d; }
        .badge-completed { background: #f3e8ff; color: #6d28d9; }
        .badge-cancelled { background: #fee2e2; color: #b91c1c; }
        .badge-pending   { background: #fef3c7; color: #92400e; }
        .badge-approved  { background: #dcfce7; color: #15803d; }
        .badge-rejected  { background: #fee2e2; color: #b91c1c; }
        .badge-available    { background: #dcfce7; color: #15803d; }
        .badge-on-trip      { background: #dbeafe; color: #1d4ed8; }
        .badge-maintenance  { background: #fef3c7; color: #92400e; }

        /* ── Forms ── */
        label { font-size: 12.5px; font-weight: 500; color: var(--muted); display: block; margin-bottom: 5px; }
        input[type=text], input[type=password], input[type=date],
        input[type=datetime-local], input[type=number], select, textarea {
            width: 100%; padding: 8px 11px; border: 1px solid var(--border);
            border-radius: 6px; font-size: 14px; color: var(--text); background: #fff;
            transition: border-color .15s, box-shadow .15s; font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none; border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37,99,235,.1);
        }
        .form-row { margin-bottom: 15px; }
        .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

        /* ── Misc utilities ── */
        .error {
            color: var(--danger); font-size: 13px; padding: 9px 13px;
            background: #fee2e2; border-radius: 6px; margin: 10px 0;
        }
        .empty {
            text-align: center; padding: 56px 20px; color: var(--muted);
        }
        .empty-icon { font-size: 40px; margin-bottom: 10px; }
        .text-muted { color: var(--muted); }
        .fw-bold { font-weight: 700; }
        .action-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

        /* ── Filter bar ── */
        .filter-bar {
            display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap;
            margin-bottom: 18px; padding: 14px 18px;
            background: white; border-radius: var(--r); box-shadow: var(--shadow-sm);
        }
        .filter-bar label { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; }
        .filter-bar select, .filter-bar input { width: auto; min-width: 140px; }

        /* ── Back link ── */
        .back-link {
            display: inline-flex; align-items: center; gap: 4px;
            color: var(--muted); text-decoration: none; font-size: 13px;
            margin-bottom: 14px; transition: color .12s;
        }
        .back-link:hover { color: var(--text); }

        /* ── Info grid (trip detail) ── */
        .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
        .info-item label { font-size: 11px; color: var(--muted); margin-bottom: 3px; text-transform: uppercase; letter-spacing: .4px; }
        .info-item span  { font-size: 14px; font-weight: 500; color: var(--text); }

        /* ── Total banner ── */
        .total-banner {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--sidebar-bg); color: white;
            border-radius: var(--r); padding: 16px 22px; margin-bottom: 20px;
        }
        .total-banner .label  { font-size: 13px; opacity: .7; }
        .total-banner .amount { font-size: 22px; font-weight: 800; }
    </style>
</head>
<body>
{% if request.cookies.get('access_token') %}
<aside class="sidebar">
    <div class="sb-brand">
        <div class="sb-brand-name">🚛 Freight TMS</div>
        <div class="sb-brand-sub">Управление перевозками</div>
    </div>
    <nav class="sb-nav">
        <div class="sb-section">Операции</div>
        <a href="/panel/trips"     class="sb-link {% if request.url.path.startswith('/panel/trips') %}active{% endif %}">
            <span class="sb-icon">📋</span> Рейсы
        </a>
        <a href="/panel/expenses"  class="sb-link {% if request.url.path.startswith('/panel/expenses') %}active{% endif %}">
            <span class="sb-icon">💳</span> Расходы
        </a>
        <a href="/panel/anomalies" class="sb-link {% if request.url.path.startswith('/panel/anomalies') %}active{% endif %}">
            <span class="sb-icon">⚠️</span> Аномалии
        </a>
        <div class="sb-section">Парк</div>
        <a href="/panel/fleet"    class="sb-link {% if request.url.path.startswith('/panel/fleet') %}active{% endif %}">
            <span class="sb-icon">🚚</span> Транспорт
        </a>
        <a href="/panel/drivers"  class="sb-link {% if request.url.path.startswith('/panel/drivers') %}active{% endif %}">
            <span class="sb-icon">👤</span> Водители
        </a>
        <a href="/panel/map"      class="sb-link {% if request.url.path.startswith('/panel/map') %}active{% endif %}">
            <span class="sb-icon">🗺️</span> Карта
        </a>
        <div class="sb-section">Аналитика</div>
        <a href="/panel/director" class="sb-link {% if request.url.path.startswith('/panel/director') %}active{% endif %}">
            <span class="sb-icon">📊</span> Директор
        </a>
    </nav>
    <div class="sb-footer">
        <a href="/panel/logout"><span>⎋</span> Выйти</a>
    </div>
</aside>
<div class="main-wrap">
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</div>
{% else %}
{% block content %}{% endblock %}
{% endif %}
</body>
</html>
