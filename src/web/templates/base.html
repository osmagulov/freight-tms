<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Freight TMS{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
    <style>
        /* ── Design tokens ── */
        :root {
            --sidebar-bg: #0d1117;
            --sidebar-w: 248px;
            --accent: #3b82f6;
            --accent-h: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --purple: #8b5cf6;
            --orange: #f97316;
            --bg: #f0f2f5;
            --surface: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --shadow-sm: 0 1px 3px rgba(0,0,0,.06);
            --shadow: 0 4px 12px rgba(0,0,0,.07);
            --shadow-lg: 0 8px 24px rgba(0,0,0,.10);
            --r: 12px;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
            background: var(--bg); color: var(--text); margin: 0; font-size: 14px; line-height: 1.5;
        }

        /* ── Sidebar ── */
        .sidebar {
            position: fixed; left: 0; top: 0; height: 100vh; width: var(--sidebar-w);
            background: var(--sidebar-bg);
            display: flex; flex-direction: column;
            z-index: 200; overflow-y: auto; overflow-x: hidden;
            border-right: 1px solid rgba(255,255,255,.05);
        }
        .sb-brand {
            padding: 20px 18px 16px; border-bottom: 1px solid rgba(255,255,255,.06); flex-shrink: 0;
            display: flex; align-items: center; gap: 10px;
        }
        .sb-brand-icon {
            width: 36px; height: 36px; border-radius: 9px; flex-shrink: 0;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; box-shadow: 0 4px 12px rgba(59,130,246,.35);
        }
        .sb-brand-text { display: flex; flex-direction: column; }
        .sb-brand-name { color: #fff; font-size: 14px; font-weight: 700; letter-spacing: .1px; line-height: 1.2; }
        .sb-brand-sub  { color: rgba(255,255,255,.3); font-size: 11px; margin-top: 1px; }
        .sb-nav { padding: 10px 0; flex: 1; }
        .sb-section {
            padding: 14px 18px 5px; font-size: 10px; font-weight: 700;
            letter-spacing: 1.2px; text-transform: uppercase; color: rgba(255,255,255,.2);
        }
        .sb-link {
            display: flex; align-items: center; gap: 10px;
            padding: 7px 18px; color: rgba(255,255,255,.5); text-decoration: none;
            font-size: 13.5px; font-weight: 500;
            transition: color .15s, background .15s;
            border-radius: 0; position: relative;
        }
        .sb-link:hover  { color: rgba(255,255,255,.85); background: rgba(255,255,255,.04); }
        .sb-link.active {
            color: #fff; background: rgba(59,130,246,.15);
        }
        .sb-link.active::before {
            content: ''; position: absolute; left: 0; top: 4px; bottom: 4px;
            width: 3px; background: var(--accent); border-radius: 0 2px 2px 0;
        }
        .sb-icon {
            width: 30px; height: 30px; border-radius: 7px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
            background: rgba(255,255,255,.06);
            transition: background .15s;
        }
        .sb-link:hover .sb-icon  { background: rgba(255,255,255,.10); }
        .sb-link.active .sb-icon { background: rgba(59,130,246,.25); }

        /* Sidebar icon colors per section */
        .sb-link[href*="trips"].active .sb-icon    { background: rgba(59,130,246,.25); }
        .sb-link[href*="expenses"].active .sb-icon { background: rgba(16,185,129,.2); }
        .sb-link[href*="anomalies"].active .sb-icon{ background: rgba(245,158,11,.2); }
        .sb-link[href*="fleet"].active .sb-icon    { background: rgba(139,92,246,.2); }
        .sb-link[href*="drivers"].active .sb-icon  { background: rgba(249,115,22,.2); }
        .sb-link[href*="repairs"].active .sb-icon  { background: rgba(239,68,68,.2); }
        .sb-link[href*="map"].active .sb-icon      { background: rgba(14,165,233,.2); }
        .sb-link[href*="director"].active .sb-icon { background: rgba(168,85,247,.2); }

        .sb-footer {
            padding: 10px 18px 16px; border-top: 1px solid rgba(255,255,255,.06); flex-shrink: 0;
        }
        .sb-footer a {
            display: flex; align-items: center; gap: 10px;
            color: rgba(255,255,255,.3); font-size: 13px; text-decoration: none;
            padding: 6px 0; transition: color .12s;
        }
        .sb-footer a:hover { color: rgba(255,255,255,.6); }

        /* ── Main layout ── */
        .main-wrap { margin-left: var(--sidebar-w); min-height: 100vh; }
        .container  { padding: 28px 32px; max-width: 1300px; }

        /* ── Page header ── */
        .page-hdr {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 24px;
        }
        .page-hdr h1, .page-hdr h2 {
            margin: 0; font-size: 22px; font-weight: 800;
            color: var(--text); letter-spacing: -.3px;
        }
        .page-hdr-left { display: flex; align-items: center; gap: 10px; }

        /* ── KPI cards — gradient style ── */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 16px; margin-bottom: 26px; }
        .kpi {
            border-radius: var(--r); padding: 20px 22px;
            box-shadow: var(--shadow);
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white; position: relative; overflow: hidden;
            transition: transform .15s, box-shadow .15s;
        }
        .kpi:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
        .kpi::after {
            content: ''; position: absolute;
            top: -24px; right: -24px; width: 80px; height: 80px;
            background: rgba(255,255,255,.10); border-radius: 50%;
        }
        .kpi::before {
            content: ''; position: absolute;
            bottom: -16px; left: -16px; width: 56px; height: 56px;
            background: rgba(255,255,255,.06); border-radius: 50%;
        }
        .kpi.green  { background: linear-gradient(135deg, #10b981 0%, #059669 100%); box-shadow: 0 4px 12px rgba(16,185,129,.25); }
        .kpi.amber  { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); box-shadow: 0 4px 12px rgba(245,158,11,.25); }
        .kpi.red    { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); box-shadow: 0 4px 12px rgba(239,68,68,.25); }
        .kpi.purple { background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%); box-shadow: 0 4px 12px rgba(139,92,246,.25); }
        .kpi.orange { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); box-shadow: 0 4px 12px rgba(249,115,22,.25); }
        .kpi-label  { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .7px; color: rgba(255,255,255,.75); margin-bottom: 10px; }
        .kpi-value  { font-size: 32px; font-weight: 900; color: #fff; line-height: 1; }
        .kpi-sub    { font-size: 11.5px; color: rgba(255,255,255,.65); margin-top: 6px; }

        /* ── Card ── */
        .card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 20px; border: 1px solid rgba(0,0,0,.04); }
        .card-hdr {
            padding: 14px 20px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            background: #fafafa;
        }
        .card-title { font-size: 14px; font-weight: 700; color: var(--text); }
        .card-body  { padding: 20px; }

        /* ── Tables ── */
        .table-wrap { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; border: 1px solid rgba(0,0,0,.04); }
        table { width: 100%; border-collapse: collapse; }
        thead th {
            background: #f8fafc; font-size: 11px; font-weight: 700;
            letter-spacing: .6px; text-transform: uppercase; color: var(--muted);
            padding: 12px 18px; text-align: left; border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        tbody td { padding: 13px 18px; border-bottom: 1px solid #f3f4f6; vertical-align: middle; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: #f9fafb; }
        tfoot td {
            padding: 13px 18px; font-weight: 700;
            background: #f1f5f9; border-top: 2px solid var(--border);
        }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 9px 18px; border-radius: 8px; font-size: 13.5px; font-weight: 600;
            text-decoration: none; border: none; cursor: pointer; white-space: nowrap;
            transition: all .15s;
            background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff;
            box-shadow: 0 2px 6px rgba(59,130,246,.3);
        }
        .btn:hover   { background: linear-gradient(135deg, #2563eb, #1d4ed8); transform: translateY(-1px); box-shadow: 0 4px 10px rgba(59,130,246,.35); color: #fff; }
        .btn:active  { transform: translateY(0); }
        .btn-sm      { padding: 6px 13px; font-size: 12.5px; border-radius: 7px; }
        .btn-xs      { padding: 4px 10px; font-size: 12px; border-radius: 6px; }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 2px 6px rgba(16,185,129,.3); }
        .btn-success:hover { background: linear-gradient(135deg, #059669, #047857); }
        .btn-danger  { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 2px 6px rgba(239,68,68,.3); }
        .btn-danger:hover  { background: linear-gradient(135deg, #dc2626, #b91c1c); }
        .btn-amber   { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; box-shadow: 0 2px 6px rgba(245,158,11,.3); }
        .btn-amber:hover { background: linear-gradient(135deg, #d97706, #b45309); }
        .btn-purple  { background: linear-gradient(135deg, #8b5cf6, #7c3aed); box-shadow: 0 2px 6px rgba(139,92,246,.3); }
        .btn-purple:hover  { background: linear-gradient(135deg, #7c3aed, #6d28d9); }
        .btn-muted   { background: #94a3b8; box-shadow: none; } .btn-muted:hover { background: #64748b; }
        .btn-dark    { background: linear-gradient(135deg, #374151, #1f2937); box-shadow: 0 2px 6px rgba(0,0,0,.2); }
        .btn-dark:hover { background: linear-gradient(135deg, #1f2937, #111827); }
        .btn-ghost   {
            background: transparent; color: var(--muted);
            border: 1px solid var(--border); box-shadow: none;
        }
        .btn-ghost:hover { background: #f3f4f6; color: var(--text); transform: none; box-shadow: none; }

        /* ── Badges ── */
        .badge {
            display: inline-flex; align-items: center; padding: 3px 10px;
            border-radius: 999px; font-size: 11.5px; font-weight: 600;
        }
        .badge-planned   { background: #dbeafe; color: #1d4ed8; }
        .badge-active    { background: #d1fae5; color: #065f46; }
        .badge-completed { background: #ede9fe; color: #5b21b6; }
        .badge-cancelled { background: #fee2e2; color: #991b1b; }
        .badge-pending   { background: #fef3c7; color: #92400e; }
        .badge-approved  { background: #d1fae5; color: #065f46; }
        .badge-rejected  { background: #fee2e2; color: #991b1b; }
        .badge-available    { background: #d1fae5; color: #065f46; }
        .badge-on-trip      { background: #dbeafe; color: #1d4ed8; }
        .badge-maintenance  { background: #fef3c7; color: #92400e; }

        /* ── Forms ── */
        label { font-size: 12.5px; font-weight: 600; color: #374151; display: block; margin-bottom: 5px; }
        input[type=text], input[type=password], input[type=date],
        input[type=datetime-local], input[type=number], select, textarea {
            width: 100%; padding: 9px 13px; border: 1.5px solid #e5e7eb;
            border-radius: 8px; font-size: 14px; color: var(--text); background: #fff;
            transition: border-color .15s, box-shadow .15s; font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none; border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59,130,246,.12);
        }
        .form-row { margin-bottom: 16px; }
        .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; }

        /* ── Misc utilities ── */
        .error {
            color: #991b1b; font-size: 13px; padding: 10px 14px;
            background: #fee2e2; border-radius: 8px; margin: 10px 0;
            border: 1px solid #fca5a5;
        }
        .empty {
            text-align: center; padding: 64px 20px; color: var(--muted);
        }
        .empty-icon { font-size: 44px; margin-bottom: 12px; opacity: .8; }
        .text-muted { color: var(--muted); }
        .fw-bold { font-weight: 700; }
        .action-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

        /* ── Filter bar ── */
        .filter-bar {
            display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap;
            margin-bottom: 20px; padding: 14px 18px;
            background: white; border-radius: var(--r); box-shadow: var(--shadow-sm);
            border: 1px solid rgba(0,0,0,.04);
        }
        .filter-bar label { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; }
        .filter-bar select, .filter-bar input { width: auto; min-width: 140px; }

        /* ── Back link ── */
        .back-link {
            display: inline-flex; align-items: center; gap: 5px;
            color: var(--muted); text-decoration: none; font-size: 13px;
            margin-bottom: 16px; transition: color .12s; font-weight: 500;
        }
        .back-link:hover { color: var(--text); }

        /* ── Info grid (trip detail) ── */
        .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
        .info-item {
            background: #f9fafb; border-radius: 8px; padding: 12px 14px;
            border: 1px solid #f3f4f6;
        }
        .info-item label { font-size: 10.5px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .5px; }
        .info-item span  { font-size: 14px; font-weight: 600; color: var(--text); }

        /* ── Total banner ── */
        .total-banner {
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(135deg, #1e293b, #0f172a); color: white;
            border-radius: var(--r); padding: 18px 24px; margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,.2);
        }
        .total-banner .label  { font-size: 13px; opacity: .6; font-weight: 500; }
        .total-banner .amount { font-size: 26px; font-weight: 900; }

        /* ── Scrollbar styling ── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    </style>
</head>
<body>
{% if request.cookies.get('access_token') %}
<aside class="sidebar">
    <div class="sb-brand">
        <div class="sb-brand-icon">🚛</div>
        <div class="sb-brand-text">
            <div class="sb-brand-name">Freight TMS</div>
            <div class="sb-brand-sub">Управление перевозками</div>
        </div>
    </div>
    <nav class="sb-nav">
        <div class="sb-section">Операции</div>
        <a href="/panel/trips"     class="sb-link {% if request.url.path.startswith('/panel/trips') %}active{% endif %}">
            <span class="sb-icon">📋</span> Рейсы
        </a>
        <a href="/panel/expenses"  class="sb-link {% if request.url.path.startswith('/panel/expenses') %}active{% endif %}">
            <span class="sb-icon">💳</span> Расходы
        </a>
        <a href="/panel/anomalies" class="sb-link {% if request.url.path.startswith('/panel/anomalies') %}active{% endif %}">
            <span class="sb-icon">⚠️</span> Аномалии
        </a>
        <div class="sb-section">Парк</div>
        <a href="/panel/fleet"    class="sb-link {% if request.url.path.startswith('/panel/fleet') %}active{% endif %}">
            <span class="sb-icon">🚚</span> Транспорт
        </a>
        <a href="/panel/drivers"  class="sb-link {% if request.url.path.startswith('/panel/drivers') %}active{% endif %}">
            <span class="sb-icon">👤</span> Водители
        </a>
        <a href="/panel/repairs"  class="sb-link {% if request.url.path.startswith('/panel/repairs') %}active{% endif %}">
            <span class="sb-icon">🔧</span> Ремонты
        </a>
        <a href="/panel/map"      class="sb-link {% if request.url.path.startswith('/panel/map') %}active{% endif %}">
            <span class="sb-icon">🗺️</span> Карта
        </a>
        <div class="sb-section">Аналитика</div>
        <a href="/panel/director" class="sb-link {% if request.url.path.startswith('/panel/director') %}active{% endif %}">
            <span class="sb-icon">📊</span> Директор
        </a>
    </nav>
    <div class="sb-footer">
        <a href="/panel/logout"><span>⎋</span> Выйти</a>
    </div>
</aside>
{% endif %}
<div class="{% if request.cookies.get('access_token') %}main-wrap{% endif %}">
    <div class="{% if request.cookies.get('access_token') %}container{% endif %}">
        {% block content %}{% endblock %}
    </div>
</div>
</body>
</html>
