{% extends "base.html" %}
{% block title %}Новый рейс — Freight TMS{% endblock %}
{% block content %}

<a href="/panel/trips" class="back-link" data-i18n="trips">← Рейсы</a>

<div class="page-hdr" style="margin-bottom:20px;">
    <h1 data-i18n="new_trip">Новый рейс</h1>
</div>

<div class="card" style="max-width:680px;">
    <div class="card-hdr"><span class="card-title" data-i18n="trip_data">Данные рейса</span></div>
    <div class="card-body">
        {% if error %}
        <div class="alert alert-danger mb-3" style="color:red; font-weight:bold;">{{ error }}</div>
        {% endif %}
        <form action="/panel/trips/create" method="post">

            <div class="form-grid-2">
                <div class="form-row">
                    <label for="driver_id" data-i18n="driver_required">Водитель *</label>
                    <select name="driver_id" id="driver_id" required>
                        <option value="" data-i18n="select_driver">— выберите водителя —</option>
                        {% for d in drivers %}
                        <option value="{{ d.id }}">{{ d.name or d.tg_id }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-row">
                    <label for="vehicle_id" data-i18n="vehicle_required">Транспорт *</label>
                    <select name="vehicle_id" id="vehicle_id" required>
                        <option value="" data-i18n="select_vehicle">— выберите борт —</option>
                        {% for v in vehicles %}
                        <option value="{{ v.id }}">{{ v.license_plate }}{% if v.make %} — {{ v.make }} {{ v.model or '' }}{% endif %}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-row">
                    <label for="status" data-i18n="trip_status_required">Статус рейса *</label>
                    <select name="status" id="status" required>
                        {% for st in TripStatus %}
                        <option value="{{ st.value }}" {% if st.value == 'ACTIVE' %}selected{% endif %}>
                            {% if st.value == 'PLANNED' %}<span data-i18n="status_planned">Запланирован</span>
                            {% elif st.value == 'ACTIVE' %}<span data-i18n="status_active_trip">Активен</span>
                            {% elif st.value == 'COMPLETED' %}<span data-i18n="status_completed">Завершён</span>
                            {% elif st.value == 'CANCELLED' %}<span data-i18n="status_cancelled">Отменён</span>
                            {% else %}{{ st.value }}{% endif %}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-row">
                    <label for="route_details" data-i18n="route">Маршрут</label>
                    <input type="text" name="route_details" id="route_details" placeholder="Например: Алматы — Астана" maxlength="500">
                </div>
            </div>

            <div class="form-row">
                <label for="load_info" data-i18n="load_info">Груз</label>
                <input type="text" name="load_info" id="load_info" placeholder="Тип и объём груза" maxlength="500">
            </div>

            <div class="form-row">
                <label for="client_name" data-i18n="client_name">Клиент</label>
                <input type="text" name="client_name" id="client_name" placeholder="Наименование клиента" maxlength="255">
            </div>

            <div class="form-grid-2">
                <div class="form-row">
                    <label for="price" data-i18n="freight_price">Стоимость (Фрахт)</label>
                    <input type="number" step="0.01" name="price" id="price" placeholder="Сумма оплаты от клиента">
                </div>
                <div class="form-row">
                    <label for="price_currency" data-i18n="freight_currency">Валюта фрахта</label>
                    <select name="price_currency" id="price_currency">
                        <option value="KZT">KZT</option>
                        <option value="USD">USD</option>
                        <option value="RUB">RUB</option>
                    </select>
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-row">
                    <label for="planned_departure" data-i18n="planned_departure_label">Планируемое отправление</label>
                    <input type="datetime-local" name="planned_departure" id="planned_departure">
                </div>
                <div class="form-row">
                    <label for="planned_arrival" data-i18n="planned_arrival_label">Планируемое прибытие</label>
                    <input type="datetime-local" name="planned_arrival" id="planned_arrival">
                </div>
            </div>

            <div class="action-group" style="margin-top:8px;">
                <button type="submit" class="btn" data-i18n="create_trip_btn">Создать рейс</button>
                <a href="/panel/trips" class="btn btn-ghost" data-i18n="cancel">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
