{% extends "base.html" %}
{% block title %}Новый рейс — Freight TMS{% endblock %}
{% block content %}

<a href="/panel/trips" class="back-link">← Рейсы</a>

<div class="page-hdr" style="margin-bottom:20px;">
    <h1>Новый рейс</h1>
</div>

<div class="card" style="max-width:680px;">
    <div class="card-hdr"><span class="card-title">Данные рейса</span></div>
    <div class="card-body">
        <form action="/panel/trips/create" method="post">

            <div class="form-grid-2">
                <div class="form-row">
                    <label for="driver_id">Водитель *</label>
                    <select name="driver_id" id="driver_id" required>
                        <option value="">— выберите водителя —</option>
                        {% for d in drivers %}
                        <option value="{{ d.id }}">{{ d.name or d.tg_id }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-row">
                    <label for="vehicle_id">Транспорт *</label>
                    <select name="vehicle_id" id="vehicle_id" required>
                        <option value="">— выберите борт —</option>
                        {% for v in vehicles %}
                        <option value="{{ v.id }}">{{ v.license_plate }}{% if v.make %} — {{ v.make }} {{ v.model or '' }}{% endif %}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-row">
                    <label for="status">Статус рейса *</label>
                    <select name="status" id="status" required>
                        {% for st in TripStatus %}
                        <option value="{{ st.value }}" {% if st.value == 'ACTIVE' %}selected{% endif %}>
                            {% if st.value == 'PLANNED' %}Запланирован
                            {% elif st.value == 'ACTIVE' %}Активен
                            {% elif st.value == 'COMPLETED' %}Завершён
                            {% elif st.value == 'CANCELLED' %}Отменён
                            {% else %}{{ st.value }}{% endif %}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-row">
                    <label for="route_details">Маршрут</label>
                    <input type="text" name="route_details" id="route_details" placeholder="Например: Алматы — Астана" maxlength="500">
                </div>
            </div>

            <div class="form-row">
                <label for="load_info">Груз</label>
                <input type="text" name="load_info" id="load_info" placeholder="Тип и объём груза" maxlength="500">
            </div>

            <div class="form-row">
                <label for="client_name">Клиент</label>
                <input type="text" name="client_name" id="client_name" placeholder="Наименование клиента" maxlength="255">
            </div>

            <div class="form-grid-2">
                <div class="form-row">
                    <label for="planned_departure">Планируемое отправление</label>
                    <input type="datetime-local" name="planned_departure" id="planned_departure">
                </div>
                <div class="form-row">
                    <label for="planned_arrival">Планируемое прибытие</label>
                    <input type="datetime-local" name="planned_arrival" id="planned_arrival">
                </div>
            </div>

            <div class="action-group" style="margin-top:8px;">
                <button type="submit" class="btn">Создать рейс</button>
                <a href="/panel/trips" class="btn btn-ghost">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
