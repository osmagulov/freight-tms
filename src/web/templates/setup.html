{% extends "base.html" %}
{% block title %}Первоначальная настройка — Freight TMS{% endblock %}
{% block content %}
<style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:#f1f5f9; }
    .auth-wrap { width:100%; max-width:400px; padding:20px; }
    .auth-card { background:white; border-radius:10px; box-shadow:0 4px 24px rgba(0,0,0,.1); overflow:hidden; }
    .auth-top  { background:#0f172a; padding:26px 28px 22px; }
    .auth-top-title { color:white; font-size:17px; font-weight:700; }
    .auth-top-sub   { color:rgba(255,255,255,.4); font-size:12px; margin-top:3px; }
    .auth-body { padding:26px 28px; }
    .auth-body label { font-size:12.5px; font-weight:500; color:#64748b; display:block; margin-bottom:5px; }
    .auth-body input  { width:100%; padding:9px 12px; border:1px solid #e2e8f0; border-radius:6px; font-size:14px; margin-bottom:14px; font-family:inherit; }
    .auth-body input:focus { outline:none; border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.1); }
    .auth-submit { width:100%; padding:10px; background:#2563eb; color:white; border:none; border-radius:6px; font-size:14.5px; font-weight:500; cursor:pointer; font-family:inherit; }
    .auth-submit:hover { background:#1d4ed8; }
    .auth-hint { color:#64748b; font-size:12.5px; margin-bottom:20px; line-height:1.5; padding:10px 14px; background:#f8fafc; border-radius:6px; border-left:3px solid #2563eb; }
    .error { color:#dc2626; font-size:13px; padding:9px 12px; background:#fee2e2; border-radius:6px; margin-bottom:14px; }
</style>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-top">
            <div class="auth-top-title">🚛 Freight TMS</div>
            <div class="auth-top-sub">Первоначальная настройка</div>
        </div>
        <div class="auth-body">
            <div class="auth-hint">Первый запуск. Создайте учётную запись диспетчера для доступа к панели управления.</div>
            <form method="post" action="/panel/setup">
                <label>Логин</label>
                <input type="text" name="username" required autofocus value="dispatcher">
                <label>Пароль (мин. 6 символов)</label>
                <input type="password" name="password" required placeholder="••••••••">
                <label>Повторите пароль</label>
                <input type="password" name="password2" required placeholder="••••••••">
                {% if error %}
                <div class="error">{{ error }}</div>
                {% endif %}
                <button type="submit" class="auth-submit">Создать аккаунт</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
