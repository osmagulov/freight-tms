{% extends "mobile/base_mobile.html" %}

{% block content %}
<div class="text-center mb-6 mt-4">
    <div class="text-5xl mb-2">🔧</div>
    <h2 class="text-2xl font-black text-gray-800" data-i18n="report_repair">СООБЩИТЬ О ПОЛОМКЕ</h2>
    <p class="text-gray-500 text-sm mt-1">Опишите неисправность борта</p>
</div>

<form action="/app/report-repair" method="post" class="space-y-5">
    <div>
        <label class="block text-sm font-black text-gray-700 mb-2 uppercase tracking-wide" data-i18n="repair_desc">Описание поломки *</label>
        <textarea
            name="description"
            rows="4"
            required
            placeholder="Например: не работает правый стоп-сигнал, течь масла из двигателя..."
            data-i18n="repair_placeholder"
            class="w-full border-2 border-gray-300 rounded-xl p-4 text-lg font-bold focus:border-orange-500 focus:outline-none resize-none"
        ></textarea>
    </div>

    <div>
        <label class="block text-sm font-black text-gray-700 mb-2 uppercase tracking-wide">Приоритет</label>
        <div class="grid grid-cols-2 gap-3">
            <label class="flex items-center gap-2 bg-white border-2 border-gray-200 rounded-xl p-3 cursor-pointer has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50">
                <input type="radio" name="priority" value="LOW" class="w-5 h-5 accent-blue-500">
                <span class="font-bold text-gray-700">Низкий</span>
            </label>
            <label class="flex items-center gap-2 bg-white border-2 border-gray-200 rounded-xl p-3 cursor-pointer has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50">
                <input type="radio" name="priority" value="NORMAL" checked class="w-5 h-5 accent-blue-500">
                <span class="font-bold text-gray-700">Нормальный</span>
            </label>
            <label class="flex items-center gap-2 bg-white border-2 border-orange-200 rounded-xl p-3 cursor-pointer has-[:checked]:border-orange-500 has-[:checked]:bg-orange-50">
                <input type="radio" name="priority" value="HIGH" class="w-5 h-5 accent-orange-500">
                <span class="font-bold text-orange-700">Высокий</span>
            </label>
            <label class="flex items-center gap-2 bg-white border-2 border-red-200 rounded-xl p-3 cursor-pointer has-[:checked]:border-red-500 has-[:checked]:bg-red-50">
                <input type="radio" name="priority" value="CRITICAL" class="w-5 h-5 accent-red-500">
                <span class="font-bold text-red-700">🚨 Критичный</span>
            </label>
        </div>
    </div>

    <button type="submit"
        class="block w-full bg-orange-500 text-white text-center text-2xl font-black h-20 rounded-2xl shadow-[0_8px_0_#c2410c] active:shadow-none active:translate-y-2 transition-all flex items-center justify-center space-x-4 mt-4 bg-gradient-to-b from-orange-400 to-orange-600">
        <span class="text-4xl">📤</span>
        <span data-i18n="save">ОТПРАВИТЬ</span>
    </button>
</form>

<a href="/app/" class="block text-center text-gray-400 font-bold mt-6 text-lg">← <span data-i18n="back">Назад</span></a>
{% endblock %}
