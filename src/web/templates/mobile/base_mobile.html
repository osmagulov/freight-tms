            <div class="bg-white px-6 py-3 rounded-xl font-black text-blue-600 text-xl shadow-xl">ОТПРАВКА... ВАЖНО: НЕ

        {% block content %}{% endblock %}

        function setLanguage(lang) {
            localStorage.setItem('driver_lang', lang);
            applyLanguage(lang);
        }

        function applyLanguage(lang) {
            const t = translations[lang] || translations['kk'];
            window.currentT = t; // Global for other scripts
            
            // Highlight active lang button
            ['kk', 'ru', 'zh'].forEach(l => {
                const btns = [document.getElementById(`lang-${l}`), document.getElementById(`lang-${l}-header`)];
                btns.forEach(btn => {
                    if (btn) {
                        if (l === lang) {
                            btn.classList.remove('grayscale', 'opacity-70');
                            btn.classList.add('bg-white', 'text-blue-600', 'shadow-sm', 'scale-110');
                        } else {
                            btn.classList.add('grayscale', 'opacity-70');
                            btn.classList.remove('bg-white', 'text-blue-600', 'shadow-sm', 'scale-110');
                        }
                    }
                });
            });

            // Update all elements with data-i18n
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    if (el.tagName === 'INPUT' && (el.type === 'button' || el.type === 'submit')) {
                        el.value = t[key];
                    } else if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                        el.placeholder = t[key];
                    } else {
                        el.innerText = t[key];
                    }
                }
            });

            // Specific UI logic if needed
            const exitBtn = document.querySelector('a[href="/app/logout"]');
            if (exitBtn) exitBtn.innerText = t['exit'];
            
            const offlineBanner = document.getElementById('offline-banner');
            if (offlineBanner) offlineBanner.innerText = t['offline_error'];
            
            const loaderText = document.querySelector('#global-loader div');
            if (loaderText) loaderText.innerText = t['sending'];
        }

        // Initialize language
        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('driver_lang') || 'kk';
            setLanguage(savedLang);
        });

        // Offline / Online detection
        const offlineBanner = document.getElementById('offline-banner');
        const submitButtons = document.querySelectorAll('button[type="submit"]');

        function updateOnlineStatus() {
            if (!navigator.onLine) {
                if (offlineBanner) offlineBanner.classList.remove('hidden');
                submitButtons.forEach(btn => {
                    btn.disabled = true;
                    btn.classList.add('opacity-50', 'cursor-not-allowed');
                });
            } else {
                if (offlineBanner) offlineBanner.classList.add('hidden');
                submitButtons.forEach(btn => {
                    btn.disabled = false;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                });
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        // Initial check
        updateOnlineStatus();

        // Image Compressor Logic
        async function compressImageFile(file, maxWidth = 1200, maxHeight = 1200, quality = 0.7) {
            if (!file || !file.type.startsWith('image/')) return file;

            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width = Math.round((width * maxHeight) / height);
                                height = maxHeight;
                            }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            // Create a new file from blob
                            const compressedFile = new File([blob], file.name, {
                                type: file.type, // 'image/jpeg' usually
                                lastModified: Date.now(),
                            });
                            resolve(compressedFile);
                        }, file.type, quality);
                    };
                };
            });
        }

        // Global Form Submission Interceptor
        document.addEventListener('DOMContentLoaded', () => {
            const forms = document.querySelectorAll('form.ajax-compress-form');

            forms.forEach(form => {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    if (!navigator.onLine) {
                        const savedLang = localStorage.getItem('driver_lang') || 'kk';
                        const t = translations[savedLang];
                        alert(t["offline_error"] || "Нет интернета!");
                        return;
                    }

                    const loader = document.getElementById('global-loader');
                    if (loader) loader.classList.remove('hidden');

                    try {
                        const formData = new FormData(form);

                        // Find all file inputs and compress images before sending
                        const fileInputs = form.querySelectorAll('input[type="file"]');
                        for (let input of fileInputs) {
                            if (input.files.length > 0) {
                                const originalFile = input.files[0];
                                const compressedFile = await compressImageFile(originalFile);
                                // Override the FormData file with the compressed one
                                formData.set(input.name, compressedFile);
                            }
                        }

                        // Submit via AJAX
                        const response = await fetch(form.action, {
                            method: form.method || 'POST',
                            body: formData,
                            redirect: 'follow'
                        });

                        if (response.redirected) {
                            window.location.href = response.url;
                        } else if (response.ok) {
                            // In case it doesn't redirect but succeeds (e.g. login)
                            window.location.reload();
                        } else {
                            alert("Ошибка на сервере при сохранении. Попробуйте еще раз.");
                            if (loader) loader.classList.add('hidden');
                        }
                    } catch (error) {
                        alert("Сетевая ошибка: " + error.message);
                        if (loader) loader.classList.add('hidden');
                    }
                });
            });
        });
