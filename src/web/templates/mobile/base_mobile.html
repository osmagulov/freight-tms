<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Водитель | Freight TMS</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f0f0f">
    
    <style>
        :root {
            --surface-low: #1a1a1a;
            --surface-medium: #242424;
            --surface-high: #2d2d2d;
            --surface-highest: #363636;
            --bg-body: #0f0f0f;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --text: #e5e7eb;
            --text-muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
            --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            padding-bottom: calc(72px + var(--safe-area-inset-bottom));
            user-select: none;
            overflow-x: hidden;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: -0.02em;
        }

        .header-logo .icon {
            color: var(--primary);
            font-variation-settings: 'FILL' 1;
        }

        .lang-switcher {
            display: flex;
            background: var(--surface-low);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2px;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            padding: 6px 10px;
            border-radius: 18px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .lang-btn.active {
            background: var(--surface-highest);
            color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        main {
            padding: 20px;
            max-width: 480px;
            margin: 0 auto;
        }

        .card {
            background: var(--surface-low);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.2);
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            height: 52px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 15px;
            transition: transform 0.1s;
            cursor: pointer;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .btn-ghost {
            background: var(--surface-medium);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        /* Bottom Tab Bar */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(26, 26, 26, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            padding-bottom: var(--safe-area-inset-bottom);
            height: calc(64px + var(--safe-area-inset-bottom));
            z-index: 1000;
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 10px;
            font-weight: 600;
            gap: 4px;
            transition: color 0.2s;
        }

        .tab-item.active {
            color: var(--primary);
        }

        .tab-item .material-symbols-outlined {
            font-size: 24px;
            font-variation-settings: 'wght' 300;
        }

        .tab-item.active .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400;
        }

        /* Form Elements */
        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        input, select, textarea {
            width: 100%;
            background: var(--surface-medium);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            color: white;
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
        }

        /* Alerts & Loaders */
        #offline-banner {
            background: var(--danger);
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 16px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }

        #global-loader {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .loader-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--surface-low);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .badge-active { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .badge-pending { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
        .badge-cancelled { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        
        {% block extra_css %}{% endblock %}
    </style>
    {% block head %}{% endblock %}
</head>

<body>
    <header>
        <div class="header-logo">
            <span class="material-symbols-outlined icon">local_shipping</span>
            <span>FREIGHT<span style="color: var(--primary);">TMS</span></span>
        </div>
        
        <div class="lang-switcher">
            <button onclick="setLanguage('kk')" id="lang-kk-header" class="lang-btn">KZ</button>
            <button onclick="setLanguage('ru')" id="lang-ru-header" class="lang-btn">RU</button>
            <button onclick="setLanguage('zh')" id="lang-zh-header" class="lang-btn">CN</button>
        </div>
    </header>

    <main>
        <div id="offline-banner" class="hidden">
            ⚠️ НЕТ ИНТЕРНЕТА. Проверьте сеть!
        </div>

        {% block content %}{% endblock %}
    </main>

    {% if driver %}
    <nav class="tab-bar">
        <a href="/app" class="tab-item {% if active_tab == 'dashboard' %}active{% endif %}">
            <span class="material-symbols-outlined">dashboard</span>
            <span data-i18n="tab_home">Главная</span>
        </a>
        <a href="/app/requests" class="tab-item {% if active_tab == 'requests' %}active{% endif %}">
            <span class="material-symbols-outlined">send_to_mobile</span>
            <span data-i18n="request_dispatcher">Запросы</span>
        </a>
        <a href="/app/documents" class="tab-item {% if active_tab == 'documents' %}active{% endif %}">
            <span class="material-symbols-outlined">folder_shared</span>
            <span data-i18n="my_documents">Документы</span>
        </a>
        <a href="/app/logout" class="tab-item">
            <span class="material-symbols-outlined">logout</span>
            <span data-i18n="exit">Выход</span>
        </a>
    </nav>
    {% endif %}

    <div id="global-loader" class="hidden">

        <div style="font-size: 12px; color: var(--text-muted); margin-top: 8px;">Не сворачивайте приложение</div>
    </div>

        function setLanguage(lang) {
            localStorage.setItem('driver_lang', lang);
            applyLanguage(lang);
        }

        function applyLanguage(lang) {
            const t = translations[lang] || translations['kk'];
            window.currentT = t; // Global for other scripts
            
            // Highlight active lang buttons
            ['kk', 'ru', 'zh'].forEach(l => {
                const btn = document.getElementById(`lang-${l}-header`);
                if (btn) {
                    if (l === lang) btn.classList.add('active');
                    else btn.classList.remove('active');
                }
            });

            // Update all elements with data-i18n
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    if (el.tagName === 'INPUT' && (el.type === 'button' || el.type === 'submit')) {
                        el.value = t[key];
                    } else if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                        el.placeholder = t[key];
                    } else {
                        el.innerText = t[key];
                    }
                }
            });

            // Specific UI logic
            const offlineBanner = document.getElementById('offline-banner');
            if (offlineBanner) offlineBanner.innerText = t['offline_error'];
            
            const loaderText = document.querySelector('#global-loader [data-i18n="sending"]');
            if (loaderText) loaderText.innerText = t['sending'];
        }

        // Initialize language
        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('driver_lang') || 'kk';
            applyLanguage(savedLang);
        });

        // Online / Offline detection
        const offlineBanner = document.getElementById('offline-banner');
        function updateOnlineStatus() {
            if (offlineBanner) {
                if (!navigator.onLine) offlineBanner.classList.remove('hidden');
                else offlineBanner.classList.add('hidden');
            }
        }
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        updateOnlineStatus();

        // Image Compressor Logic
        async function compressImageFile(file, maxWidth = 1200, maxHeight = 1200, quality = 0.7) {
            if (!file || !file.type.startsWith('image/')) return file;
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width = Math.round((width * maxHeight) / height);
                                height = maxHeight;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => {
                            const compressedFile = new File([blob], file.name, {
                                type: file.type,
                                lastModified: Date.now(),
                            });
                            resolve(compressedFile);
                        }, file.type, quality);
                    };
                };
            });
        }

        // Global Form Submission Interceptor
        document.addEventListener('DOMContentLoaded', () => {
            const forms = document.querySelectorAll('form.ajax-compress-form');
            forms.forEach(form => {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    if (!navigator.onLine) {
                        const savedLang = localStorage.getItem('driver_lang') || 'kk';
                        alert(translations[savedLang]["offline_error"] || "Нет интернета!");
                        return;
                    }

                    const loader = document.getElementById('global-loader');
                    if (loader) loader.classList.remove('hidden');

                    try {
                        const formData = new FormData(form);
                        const fileInputs = form.querySelectorAll('input[type="file"]');
                        for (let input of fileInputs) {
                            if (input.files.length > 0) {
                                const compressedFile = await compressImageFile(input.files[0]);
                                formData.set(input.name, compressedFile);
                            }
                        }

                        const response = await fetch(form.action, {
                            method: form.method || 'POST',
                            body: formData,
                            redirect: 'follow'
                        });

                        if (response.redirected) {
                            window.location.href = response.url;
                        } else if (response.ok) {
                            window.location.reload();
                        } else {
                            alert("Ошибка на сервере. Попробуйте еще раз.");
                            if (loader) loader.classList.add('hidden');
                        }
                    } catch (error) {
                        alert("Сетевая ошибка: " + error.message);
                        if (loader) loader.classList.add('hidden');
                    }
                });
            });
        });
    </script>
