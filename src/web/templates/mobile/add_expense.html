{% extends "mobile/base_mobile.html" %}

{% block content %}
<div class="mb-6">
    <a href="/app/"
        class="inline-flex items-center text-blue-600 font-black text-xl bg-blue-50 px-4 py-2 rounded-xl active:bg-blue-100">
        <span class="text-3xl mr-2">←</span> <span data-i18n="back">НАЗАД</span>
    </a>
</div>

<div class="bg-white rounded-2xl shadow-xl p-6 border-t-[10px] border-blue-500">
    <div class="flex justify-center -mt-10 mb-4">
        <div class="bg-blue-100 p-4 rounded-full border-4 border-white shadow-md">
            <span class="text-5xl">💸</span>
        </div>
    </div>

    <h1 class="text-2xl font-black text-center mb-6 uppercase tracking-wide text-gray-800" data-i18n="add_expense">ДОБАВИТЬ РАСХОД</h1>

    <form method="POST" action="/app/add-expense" enctype="multipart/form-data"
        class="space-y-6 ajax-compress-form cursor-pointer" id="expense-form">

        <div>
            <label class="block text-gray-700 text-lg font-bold mb-2">Что оплатили?</label>
            <select name="expense_type" id="expense_type" onchange="onTypeChange()"
                class="w-full text-xl p-4 border border-gray-300 rounded-xl focus:ring-4 focus:ring-blue-500 bg-gray-50 focus:bg-white outline-none">
                <option value="FUEL" data-i18n="type_fuel">⛽ Заправил топливо</option>
                <option value="FINE" data-i18n="type_fine">👮 Штраф</option>
                <option value="REPAIR" data-i18n="type_repair">🔧 Ремонт авто</option>
                <option value="OTHER" data-i18n="type_other">📦 Другое</option>
            </select>
        </div>

        <!-- 📸 RECEIPT PHOTO — always first, with AI parsing for FUEL -->
        <div>
            <label class="block text-gray-700 text-lg font-bold mb-2" data-i18n="receipt_photo">📸 Фото ЧЕКА</label>
            <div class="relative">
                <input type="file" name="receipt" id="receipt-input" accept="image/*" capture="environment"
                    onchange="onReceiptSelected()"
                    class="w-full text-lg p-3 bg-blue-50 border-2 border-blue-200 border-dashed rounded-xl file:mr-4 file:py-3 file:px-6 file:rounded-xl file:border-0 file:text-lg file:font-bold file:bg-blue-600 file:text-white hover:file:bg-blue-700 text-blue-900 cursor-pointer h-24 flex items-center justify-center">
            </div>
            <!-- AI parsing status -->
            <div id="ai-status" class="hidden mt-2 p-3 rounded-xl text-center font-bold"></div>
        </div>

        <!-- FUEL-specific fields -->
        <div id="fuel-fields" class="space-y-5 bg-orange-50 border-2 border-orange-200 rounded-2xl p-4">
            <div class="text-orange-700 font-black text-base uppercase tracking-wide mb-1">⛽ Данные заправки</div>
            <div>
                <label class="block text-gray-700 text-base font-bold mb-1" data-i18n="liters">Литров залито</label>
                <input type="number" step="0.1" name="liters" id="liters" placeholder="50.0" inputmode="decimal"
                    class="w-full text-xl p-4 border border-gray-300 rounded-xl focus:ring-4 focus:ring-orange-400 bg-white outline-none">
            </div>
            <div>
                <label class="block text-gray-700 text-base font-bold mb-1">Одометр СЕЙЧАС (км)</label>
                <input type="number" step="1" name="odometer" id="odometer" placeholder="450000" inputmode="numeric"
                    oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                    class="w-full text-xl p-4 border border-gray-300 rounded-xl focus:ring-4 focus:ring-orange-400 bg-white outline-none">
            </div>
            <div>
                <label class="block text-gray-700 text-base font-bold mb-1">Название АЗС</label>
                <input type="text" name="station" id="station" placeholder="Shell Алматы"
                    class="w-full text-xl p-4 border border-gray-300 rounded-xl focus:ring-4 focus:ring-orange-400 bg-white outline-none">
            </div>
        </div>

        <!-- Amount + currency -->
        <div>
            <label class="block text-gray-700 text-lg font-bold mb-2" data-i18n="amount">🔢 Потраченная СУММА</label>
            <div class="flex">
                <input type="number" step="0.01" name="amount" id="amount" placeholder="0" inputmode="decimal" required
                    class="flex-grow text-xl p-4 border border-gray-300 rounded-l-xl focus:ring-4 focus:ring-blue-500 bg-gray-50 focus:bg-white outline-none">
                <select name="currency" id="currency"
                    class="w-32 text-xl p-4 border border-l-0 border-gray-300 rounded-r-xl bg-gray-200 focus:ring-4 focus:ring-blue-500 outline-none font-bold">
                    <option value="KZT">KZT ₸</option>
                    <option value="RUB">RUB ₽</option>
                    <option value="USD">USD $</option>
                    <option value="EUR">EUR €</option>
                </select>
            </div>
        </div>

        <!-- Payment Method -->
        <div id="fuel-card-field" class="hidden">
            <label class="block text-gray-700 text-lg font-bold mb-2">💳 Способ оплаты</label>
            <select id="payment_method_select" onchange="onPaymentMethodChange()"
                class="w-full text-xl p-4 border border-gray-300 rounded-xl focus:ring-4 focus:ring-blue-500 bg-gray-50 focus:bg-white outline-none mb-3">
                {% if fuel_card_number %}
                <option value="{{ fuel_card_number }}">Моя карта ({{ fuel_card_number|truncate(8, True) }})</option>
                {% endif %}
                <option value="CASH">💵 Наличные</option>
                <option value="OTHER_CARD" {% if not fuel_card_number %}selected{% endif %}>💳 Другая карта (указать вручную)</option>
            </select>
            
            <div id="other-card-div" class="{% if fuel_card_number %}hidden{% endif %}">
                <input type="text" name="fuel_card_number" id="fuel_card_number" value="{{ fuel_card_number or '' }}"
                    placeholder="Пример: 4433 2211 0000 9999"
                    class="w-full text-xl p-4 border border-gray-300 rounded-xl focus:ring-4 focus:ring-blue-500 bg-gray-50 focus:bg-white outline-none tracking-wider">
            </div>
            
            {% if fuel_card_number %}
            <div id="saved-card-hint" class="text-green-600 text-sm font-bold mt-1">✓ Выбрана ваша сохранённая карта</div>
            {% endif %}
        </div>



        <div>
            <label class="block text-gray-700 text-lg font-bold mb-2">✍️ Комментарий <span
                    class="text-gray-400 font-normal">(за что?)</span></label>
            <textarea name="comment" rows="2"
                class="w-full text-xl p-4 border border-gray-300 rounded-xl focus:ring-4 focus:ring-blue-500 bg-gray-50 focus:bg-white outline-none"
                data-i18n="comment_placeholder" placeholder="Напишите здесь..."></textarea>
        </div>

        <button type="submit"
            class="w-full bg-blue-600 text-white text-2xl font-black py-6 rounded-2xl shadow-[0_6px_0_#1d4ed8] active:shadow-none active:translate-y-2 transition-all mt-8 bg-gradient-to-b from-blue-500 to-blue-600 flex justify-center items-center space-x-3">
            <span data-i18n="save">СОХРАНИТЬ</span>
            <span class="text-3xl">💾</span>
        </button>
    </form>
</div>

<script>
    function onTypeChange() {
        const type = document.getElementById('expense_type').value;
        const fuelFields = document.getElementById('fuel-fields');
        const fuelCardField = document.getElementById('fuel-card-field');
        const liters = document.getElementById('liters');
        const odometer = document.getElementById('odometer');
        if (type === 'FUEL') {
            fuelFields.classList.remove('hidden');
            fuelCardField.classList.remove('hidden');
            liters.required = true;
            odometer.required = true;
        } else {
            fuelFields.classList.add('hidden');
            fuelCardField.classList.add('hidden');
            liters.required = false;
            odometer.required = false;
        }
    }

    function onPaymentMethodChange() {
        const pm = document.getElementById('payment_method_select').value;
        const otherDiv = document.getElementById('other-card-div');
        const input = document.getElementById('fuel_card_number');
        const savedHint = document.getElementById('saved-card-hint');
        
        if (pm === 'OTHER_CARD') {
            otherDiv.classList.remove('hidden');
            input.value = ''; // let them type
            if(savedHint) savedHint.classList.add('hidden');
        } else if (pm === 'CASH') {
            otherDiv.classList.add('hidden');
            input.value = 'Наличные';
            if(savedHint) savedHint.classList.add('hidden');
        } else {
            // It's the saved card
            otherDiv.classList.add('hidden');
            input.value = pm;
            if(savedHint) savedHint.classList.remove('hidden');
        }
    }

    function onReceiptSelected() {
        const type = document.getElementById('expense_type').value;
        if (type !== 'FUEL') return; // AI parsing only for fuel receipts

        const fileInput = document.getElementById('receipt-input');
        const file = fileInput.files[0];
        if (!file) return;

        const statusDiv = document.getElementById('ai-status');
        statusDiv.classList.remove('hidden');
        statusDiv.className = 'mt-2 p-3 rounded-xl text-center font-bold bg-yellow-100 text-yellow-800 border-2 border-yellow-300';
        statusDiv.innerHTML = '🤖 ИИ анализирует чек... подождите';

        const formData = new FormData();
        formData.append('receipt', file);

        fetch('/app/parse-receipt', { method: 'POST', body: formData })
            .then(r => r.json())
            .then(data => {
                if (data.ok) {
                    // Fill in extracted values
                    if (data.liters) document.getElementById('liters').value = data.liters;
                    if (data.amount) document.getElementById('amount').value = data.amount;
                    if (data.station) document.getElementById('station').value = data.station;
                    if (data.currency) {
                        const sel = document.getElementById('currency');
                        for (let opt of sel.options) {
                            if (opt.value === data.currency) { sel.value = data.currency; break; }
                        }
                    }
                    statusDiv.className = 'mt-2 p-3 rounded-xl text-center font-bold bg-green-100 text-green-800 border-2 border-green-300';
                    statusDiv.innerHTML = '✅ ИИ заполнил данные — проверьте и скорректируйте если нужно';

                    // Highlight filled fields briefly
                    ['liters', 'amount', 'station'].forEach(id => {
                        const el = document.getElementById(id);
                        if (el.value) {
                            el.classList.add('ring-4', 'ring-green-300');
                            setTimeout(() => el.classList.remove('ring-4', 'ring-green-300'), 3000);
                        }
                    });
                } else {
                    statusDiv.className = 'mt-2 p-3 rounded-xl text-center font-bold bg-red-100 text-red-800 border-2 border-red-300';
                    statusDiv.innerHTML = '⚠️ ' + (data.error || 'Не удалось распознать') + ' — заполните вручную';
                }
            })
            .catch(err => {
                statusDiv.className = 'mt-2 p-3 rounded-xl text-center font-bold bg-red-100 text-red-800 border-2 border-red-300';
                statusDiv.innerHTML = '⚠️ Ошибка сети — заполните вручную';
            });
    }

    // Init on load
    onTypeChange();
</script>
{% endblock %}
