{% extends "mobile/base_mobile.html" %}

{% block content %}
<div class="text-center mb-8 mt-6">
    <div class="inline-flex items-center justify-center w-20 h-20 bg-danger/10 border-2 border-danger/20 rounded-full mb-4">
        <span class="material-symbols-outlined text-danger" style="font-size: 40px; font-variation-settings: 'FILL' 1;">flag</span>
    </div>
    <h2 class="text-2xl font-black text-white" data-i18n="close_trip">ЗАВЕРШИТЬ РЕЙС</h2>
    <p class="text-text-muted text-sm mt-1">Финальная проверка и фиксация данных</p>
</div>

<div class="glass-card rounded-[24px] p-6 mb-6">
    <form action="/app/close-trip" method="post" enctype="multipart/form-data" class="space-y-6">
        <div class="input-group">
            <label class="flex items-center gap-2 mb-3">
                <span class="material-symbols-outlined text-primary text-lg">speed</span>
                <span class="text-xs font-black text-text-muted uppercase tracking-wider" data-i18n="final_odo">Конечный одометр</span>
            </label>
            <input 
                type="number" 
                name="end_odometer" 
                required 
                placeholder="000 000"
                class="w-full bg-surface-low border-2 border-border rounded-2xl p-4 text-2xl font-black text-white focus:border-primary outline-none transition-all placeholder:opacity-20"
            >
        </div>

        <div class="photo-upload-zone" onclick="document.getElementById('closing-photo').click()">
            <input type="file" name="photo" id="closing-photo" accept="image/*" capture="camera" class="hidden" required onchange="handlePhotoSelect(this)">
            <div id="photo-placeholder" class="flex flex-col items-center py-6">
                <span class="material-symbols-outlined text-text-muted text-4xl mb-2">add_a_photo</span>
                <span class="text-xs font-bold text-text-muted uppercase" data-i18n="add_closing_doc">Фото CMR / Акта выгрузки</span>
            </div>
            <div id="photo-preview-container" class="hidden w-full aspect-video rounded-xl overflow-hidden relative">
                <img id="photo-preview" src="" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity">
                    <span class="text-white font-bold text-xs">ЗАМЕНИТЬ ФОТО</span>
                </div>
            </div>
        </div>

        <button type="submit" 
            class="block w-full bg-danger text-white text-center text-xl font-black h-20 rounded-[22px] shadow-[0_8px_0_#991b1b] active:shadow-none active:translate-y-2 transition-all flex items-center justify-center gap-4 mt-8">
            <span class="material-symbols-outlined text-2xl">check_circle</span>
            <span data-i18n="finish_trip">ФИНИШ</span>
        </button>
    </form>
</div>

<div class="px-6 text-center">
    <a href="/app/" class="inline-flex items-center gap-2 text-text-muted font-bold text-sm bg-surface-low/50 px-6 py-3 rounded-full border border-border">
        <span class="material-symbols-outlined text-lg">arrow_back</span>
        <span data-i18n="back">НАЗАД В МЕНЮ</span>
    </a>
</div>

<script>
function handlePhotoSelect(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('photo-preview').src = e.target.result;
            document.getElementById('photo-placeholder').classList.add('hidden');
            document.getElementById('photo-preview-container').classList.remove('hidden');
        }
        reader.readAsDataURL(input.files[0]);
    }
}
</script>
{% endblock %}
