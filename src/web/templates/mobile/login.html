{% extends "mobile/base_mobile.html" %}

{% block content %}
<div class="bg-white rounded-2xl shadow-xl p-8 mt-12 border-t-8 border-blue-500">
    <div class="flex justify-center mb-6">
        <span class="text-6xl">🧑‍✈️</span>
    </div>
    <h1 class="text-3xl font-black text-center text-gray-800 mb-2">ВХОД</h1>
    <p class="text-center text-gray-500 mb-8 font-medium mx-4">Введите номер, который давали диспетчеру</p>

    <form method="POST" action="/app/login" class="space-y-6">
        {% if error %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
            <span class="block sm:inline">{{ error }}</span>
        </div>
        {% endif %}
        <div>
            <input type="tel" name="phone" placeholder="+7 (777) 123-4567" required
                class="w-full text-xl p-4 border-2 border-gray-300 bg-gray-50 font-bold rounded-xl focus:ring-4 focus:border-blue-500 focus:ring-blue-200 focus:bg-white text-center transition outline-none tracking-wider mb-2">
            <input type="password" name="password" placeholder="Пароль" required
                class="w-full text-xl p-4 border-2 border-gray-300 bg-gray-50 font-bold rounded-xl focus:ring-4 focus:border-blue-500 focus:ring-blue-200 focus:bg-white text-center transition outline-none tracking-wider">
        </div>
        <button type="submit"
            class="w-full bg-blue-600 text-white text-2xl font-black py-5 rounded-xl shadow-[0_6px_0_#1e3a8a] active:shadow-none active:translate-y-2 transition-all">
            ВОЙТИ
        </button>
    </form>
</div>

<div class="text-center mt-12 text-gray-400 font-bold text-sm">
    TMS MOBILE v1.0
</div>
{% endblock %}
