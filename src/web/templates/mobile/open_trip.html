{% extends "mobile/base_mobile.html" %}

{% block content %}
<div class="mb-6">
    <a href="/app/"
        class="inline-flex items-center text-blue-600 font-black text-xl bg-blue-50 px-4 py-2 rounded-xl active:bg-blue-100">
        <span class="text-3xl mr-2">←</span> НАЗАД
    </a>
</div>

<div class="bg-white rounded-2xl shadow-xl p-6 border-t-[10px] border-green-500">
    <div class="flex justify-center -mt-10 mb-4">
        <div class="bg-green-100 p-4 rounded-full border-4 border-white shadow-md">
            <span class="text-5xl">🚚</span>
        </div>
    </div>

    <h1 class="text-2xl font-black text-center mb-6 uppercase tracking-wide text-gray-800">НАЧАТЬ РЕЙС</h1>

    <form method="POST" action="/app/open-trip" enctype="multipart/form-data"
        class="space-y-6 ajax-compress-form cursor-pointer">
        <div>
            <label class="block text-gray-700 text-lg font-bold mb-2">📍 Откуда - Куда едете?</label>
            <input type="text" name="route" placeholder="Алматы - Москва" required
                class="w-full text-xl p-4 border border-gray-300 rounded-xl focus:ring-4 focus:ring-green-500 bg-gray-50 focus:bg-white outline-none">
        </div>

        <div>
            <label class="block text-gray-700 text-lg font-bold mb-2">🚚 ВЫБЕРИТЕ или ВВЕДИТЕ номер машины</label>
            <input type="text" name="vehicle_plate" placeholder="123 ABC 01" list="vehicle_list" required
                oninput="this.value = this.value.toUpperCase()"
                class="w-full text-xl p-4 border border-gray-300 rounded-xl focus:ring-4 focus:ring-green-500 bg-gray-50 focus:bg-white outline-none uppercase"
                style="text-transform: uppercase;">
            <datalist id="vehicle_list">
                {% for v in vehicles %}
                    <option value="{{ v.license_plate }}">{% if v.make %}{{ v.make }} {{ v.model }}{% endif %}</option>
                {% endfor %}
            </datalist>
        </div>

        <div>
            <label class="block text-gray-700 text-lg font-bold mb-2">🔢 Пробег машины СЕЙЧАС (цифры)</label>
            <input type="number" name="odometer" placeholder="450000" inputmode="numeric" required
                oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                class="w-full text-xl p-4 border border-gray-300 rounded-xl focus:ring-4 focus:ring-green-500 bg-gray-50 focus:bg-white outline-none">
        </div>

        <div>
            <label class="block text-gray-700 text-lg font-bold mb-2">📸 Фото накладной (CMR)</label>
            <div class="relative">
                <input type="file" name="document" accept="image/*" capture="environment"
                    class="w-full text-lg p-3 bg-green-50 border-2 border-green-200 border-dashed rounded-xl file:mr-4 file:py-3 file:px-6 file:rounded-xl file:border-0 file:text-lg file:font-bold file:bg-green-600 file:text-white hover:file:bg-green-700 text-green-900 cursor-pointer h-24 flex items-center justify-center">
            </div>
        </div>

        <button type="submit"
            class="w-full bg-green-600 text-white text-2xl font-black py-6 rounded-2xl shadow-[0_6px_0_#15803d] active:shadow-none active:translate-y-2 transition-all mt-8 bg-gradient-to-b from-green-500 to-green-600 flex justify-center items-center space-x-3">
            <span>ОТКРЫТЬ РЕЙС</span>
            <span class="text-3xl">🚀</span>
        </button>
    </form>
</div>
{% endblock %}
